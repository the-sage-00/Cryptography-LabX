rules:
  - id: iot-v1-command-injection-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      V1 Command Injection: subprocess is called with shell=True on a command string that
      contains user-controlled data. Use an argument list with shell=False and validate input.
    metadata: {cwe: "CWE-78: OS Command Injection", owasp: "A03:2021 - Injection"}
    pattern: subprocess.run(..., shell=True, ...)

  - id: iot-v2-path-traversal-open-joined-path
    languages: [python]
    severity: ERROR
    message: >-
      V2 Path Traversal: a file is opened from a path built with os.path.join() using an
      unvalidated filename. Resolve the path and verify it stays inside the base folder.
    metadata: {cwe: "CWE-22: Path Traversal", owasp: "A01:2021 - Broken Access Control"}
    pattern: |
      def $F(..., $NAME, ...):
          ...
          $P = os.path.join($BASE, $NAME)
          ...
          with open($P, ...) as $H:
              ...

  - id: iot-v3-missing-authentication-privileged-function
    languages: [python]
    severity: WARNING
    message: >-
      V3 Missing Authentication: privileged function takes no session/credential parameter, so
      any caller can modify device configuration or firmware.
    metadata: {cwe: "CWE-306: Missing Authentication for Critical Function", owasp: "A07:2021 - Identification and Authentication Failures"}
    pattern-either:
      - pattern: |
          def update_configuration($DEV, ...):
              ...
      - pattern: |
          def upload_firmware($DEV, ...):
              ...
    paths:
      exclude: ["*_secure.py"]
